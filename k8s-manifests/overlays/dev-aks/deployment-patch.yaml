apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payments-system
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: 'true'
    spec:
      containers:
      - name: payment-service
        image: acrpaymentsdev84bwov.azurecr.io/payments-sandbox/payment-service:latest
        env:
        - name: AZURE_CLIENT_ID
          value: a11a7c88-abae-4064-b84d-90750b29c01b
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: host
        - name: DB_NAME
          value: payments
        - name: DB_SSLMODE
          value: require
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
---
